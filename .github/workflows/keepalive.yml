name: Keep backend awake

# Render's free tier spins the service down after ~15 min of inactivity, so the
# first chat after idle can hang 30-50s or error out. This pings the backend's
# lightweight /api/health route every 14 minutes to keep the instance warm.
# /api/health does NOT call OpenRouter, so this costs nothing in API keys.
on:
  schedule:
    - cron: "*/14 * * * *"   # every 14 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -fsS -m 20 "https://saint-augustine-ai-backend.onrender.com/api/health" \
            || echo "ping failed (backend may be cold-spawning — Render will still serve the next real request)"
