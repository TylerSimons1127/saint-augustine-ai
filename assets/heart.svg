<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 78" fill="none" role="img" aria-label="Sacred Heart of Saint Augustine">
  <defs>
    <radialGradient id="ht" cx="40%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#b03141"/>
      <stop offset="45%" stop-color="#8c1f2c"/>
      <stop offset="100%" stop-color="#560d16"/>
    </radialGradient>
    <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e2701f"/>
      <stop offset="45%" stop-color="#f3a838"/>
      <stop offset="100%" stop-color="#ffe39a"/>
    </linearGradient>
    <radialGradient id="flg" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#f6b24e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f6b24e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ar" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a24a"/>
      <stop offset="100%" stop-color="#6f5320"/>
    </linearGradient>
  </defs>

  <ellipse cx="32" cy="20" rx="21" ry="19" fill="url(#flg)"/>

  <!-- FLAMES: varied heights, curling tips, hot cores -->
  <g stroke="#c4681d" stroke-width="1" stroke-linejoin="round">
    <path d="M32 31 C30.5 20 27 14 29 6 C30.5 -2 36 -2.5 33.6 5 C31.5 11 36 13 34.5 20 C33.8 25 33.4 28 32 31 Z" fill="url(#fl)"/>
    <path d="M32 29 C31 22 30 17 31.2 11 C31.8 8 33.4 7.5 33.6 11 C34 14.5 34.6 16.5 33.7 21 C33.3 25 32.6 27 32 29 Z" fill="#ffe7a6" opacity="0.92" stroke="none"/>
    <path d="M25 32.5 C22.5 24 17.5 20.5 17.5 13 C17.5 7.5 21.5 6.5 22 12 C22.5 16.5 26 17.5 25.3 24 C25 28 26.6 30 25 32.5 Z" fill="url(#fl)"/>
    <path d="M24.9 31 C23.5 25 20 22 20.5 16.5 C20.8 14 22.6 13 22.8 16.5 C23.1 20 24.6 21 24.3 25 C24.1 28 24.9 29.4 24.9 31 Z" fill="#ffe7a6" opacity="0.9" stroke="none"/>
    <path d="M39 32.5 C41.5 24 46.5 20.5 46.5 13 C46.5 7.5 42.5 6.5 42 12 C41.5 16.5 38 17.5 38.7 24 C39 28 37.4 30 39 32.5 Z" fill="url(#fl)"/>
    <path d="M39.1 31 C40.5 25 44 22 43.5 16.5 C43.2 14 41.4 13 41.2 16.5 C40.9 20 39.4 21 39.7 25 C39.9 28 39.1 29.4 39.1 31 Z" fill="#ffe7a6" opacity="0.9" stroke="none"/>
  </g>

  <!-- HEART -->
  <path d="M32 33 C30.5 28 27 23.5 20.5 23.5 C12 23.5 9.5 32 12 38.5 C14.5 49 23 57.5 32 64 C41 57.5 49.5 49 52 38.5 C54.5 32 52 23.5 43.5 23.5 C37 23.5 33.5 28 32 33 Z"
        fill="url(#ht)" stroke="#caa24a" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- layered highlight for depth -->
  <ellipse cx="22.5" cy="34" rx="6" ry="9.5" fill="#ffffff" opacity="0.14"/>
  <ellipse cx="21" cy="32" rx="2.6" ry="4.5" fill="#ffffff" opacity="0.22"/>

  <!-- ARROW: enters upper-right (feathered), exits lower-left (sharp barbed point) -->
  <g>
    <!-- shaft with subtle highlight for volume -->
    <line x1="47.5" y1="12.5" x2="19" y2="50" stroke="url(#ar)" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="46.8" y1="13.4" x2="20.5" y2="47" stroke="#f0d68a" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
    <!-- sharp bright triangular arrowhead at lower-left -->
    <path d="M19 50 L9.5 47 L16.5 42.5 Z" fill="#e9c873" stroke="#6f5320" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M19 50 L11 54.5 L18 56 Z" fill="#d8b257" stroke="#6f5320" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M19 50 L8.5 49.5 L14 45 Z" fill="#f0d68a" stroke="#6f5320" stroke-width="0.7" stroke-linejoin="round"/>
    <!-- soft feather vanes at upper-right -->
    <path d="M47.5 12.5 C52 8.5 56.5 8 58 10.5 C55 11.5 51.5 13.5 49.5 16.5 Z" fill="#c9a24a" stroke="#7a5a22" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M47.5 12.5 C50.5 16 53 19.5 53.5 23 C50.5 20.5 47.5 17.5 46.5 15 Z" fill="#ddb85e" stroke="#7a5a22" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M47.5 12.5 C49 9 51.5 6.5 54 5 C53 8 51.5 11 49 13 Z" fill="#e6c873" stroke="#7a5a22" stroke-width="0.5" stroke-linejoin="round"/>
  </g>
</svg>
